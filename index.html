<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASA AI Videos | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin: 40px 0 30px 0;
            border-bottom: 2px solid #ff0033;
            padding-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        h1 { color: #ff0033; font-size: 28px; letter-spacing: 2px; }
        p.subtitle { color: #888; font-size: 14px; margin-top: 5px; }
        .tier-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .tier-card {
            background: #141414;
            border: 1px solid #333;
            border-left: 4px solid #ff0033;
            padding: 20px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .tier-card:hover {
            border-color: #ff0033;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.2);
        }
        .tier-title { font-size: 18px; font-weight: bold; color: #fff; }
        .tier-details { color: #aaa; font-size: 14px; margin: 8px 0; }
        .tier-price { color: #ff0033; font-size: 16px; font-weight: bold; }
        .order-btn {
            display: block;
            width: 100%;
            background-color: #ff0033;
            color: #fff;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .order-btn:hover { background-color: #cc0029; }
    </style>
</head>
<body>

    <header>
        <h1>ASA.AI.VIDEOS</h1>
        <p class="subtitle">Cyberpunk & Modern AI Video Generation</p>
    </header>

    <div class="tier-container">
        <div class="tier-card">
            <div class="tier-title">START TIER</div>
            <div class="tier-details">Duration: 60 seconds</div>
            <div class="tier-price">50,000 UZS</div>
        </div>

        <div class="tier-card">
            <div class="tier-title">PROFESSIONAL TIER</div>
            <div class="tier-details">Duration: 90 seconds</div>
            <div class="tier-price">100,000 UZS</div>
        </div>

        <div class="tier-card">
            <div class="tier-title">PREMIUM TIER</div>
            <div class="tier-details">Duration: 3 minutes</div>
            <div class="tier-price">150,000 UZS</div>
        </div>
    </div>

    <a href="https://instagram.com/asa.ai.videos" class="order-btn">BUYURTMA BERISH (INSTAGRAM)</a>

</body>
</html>
